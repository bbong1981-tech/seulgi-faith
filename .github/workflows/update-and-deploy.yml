# 1시간마다 설교(유튜브)·블로그(네이버) 새 글을 모아 앱에 넣고, GitHub Pages로 앱을 올립니다.
name: 설교·블로그 수집 및 앱 배포

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분 (한국 시간 기준으로도 매시 17분)
  push:
    branches: [main]
  workflow_dispatch:        # Actions 화면에서 '지금 실행' 가능

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 설교·블로그 새 글 모으기
        run: node scripts/update-feeds.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # 없어도 됨 (있으면 지난 설교까지 더 많이)
          SEMINAR_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}   # 직접 실행할 때만 페이지 구조 기록

      - name: 바뀐 목록 저장
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/feeds feeds.config.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "설교·블로그 목록 갱신"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 새 글이 없으면 매시간 다시 올리지 않음 (앱 코드를 고쳐 올렸거나 직접 실행한 경우는 항상 올림)
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deploy
        uses: actions/deploy-pages@v4
