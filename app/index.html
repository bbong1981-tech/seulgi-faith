<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슬기로운 신앙생활</title>
<meta name="description" content="개역한글·KJV 성경, 성경읽기표, 단어사전, 기도노트, 찬양, 교회 일정 알림">
<meta name="theme-color" content="#f6eee3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-v2.ico" sizes="48x48">
<link rel="icon" href="icons/favicon-v2.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32-v2.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="슬기로운 신앙생활">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
<aside class="sidebar" aria-label="메뉴">
  <div class="brand">
    <div class="avatar" id="mascotSide"></div>
    <div class="brand-name">슬기로운<br>신앙생활</div>
    <div class="brand-sub">BIBLE · PRAYER · CHURCH</div>
  </div>
  <nav class="side-nav" id="sideNav">
    <button data-tab="bible"><span class="ni" data-icon="book"></span>성경</button>
    <button data-tab="plan"><span class="ni" data-icon="check"></span>읽기표</button>
    <button data-tab="dict"><span class="ni" data-icon="dict"></span>단어사전</button>
    <button data-tab="prayer"><span class="ni" data-icon="hands"></span>기도 노트</button>
    <button data-tab="hymn"><span class="ni" data-icon="music"></span>찬양</button>
    <button data-tab="sermon"><span class="ni" data-icon="play"></span>설교</button>
    <button data-tab="blog"><span class="ni" data-icon="pen"></span>블로그</button>
    <button data-tab="events"><span class="ni" data-icon="calendar"></span>교회 일정</button>
  </nav>
  <div class="side-card" id="sideCard"></div>
  <div class="theme-toggle" role="group" aria-label="화면 테마">
    <button data-act="quickTheme" data-t="light" aria-label="밝게"><span data-icon="sun"></span></button>
    <button data-act="quickTheme" data-t="dark" aria-label="어둡게"><span data-icon="moon"></span></button>
  </div>
</aside>

<div class="page">
  <header class="topbar">
    <div class="titles">
      <h1 id="title">슬기로운 신앙생활</h1>
      <p id="subtitle"></p>
    </div>
    <div class="top-actions" id="topActions"></div>
    <button class="icon-btn" id="settingsBtn" aria-label="설정"><span data-icon="settings"></span></button>
  </header>
  <main id="view"></main>
</div>
</div>

<nav class="tabbar" id="tabbar" aria-label="메뉴">
  <div class="tab-scroll" id="tabScroll">
    <button data-tab="bible" class="active"><span class="ti" data-icon="book"></span><span>성경</span></button>
    <button data-tab="plan"><span class="ti" data-icon="check"></span><span>읽기표</span></button>
    <button data-tab="dict"><span class="ti" data-icon="dict"></span><span>사전</span></button>
    <button data-tab="prayer"><span class="ti" data-icon="hands"></span><span>기도</span></button>
    <button data-tab="hymn"><span class="ti" data-icon="music"></span><span>찬양</span></button>
    <button data-tab="sermon"><span class="ti" data-icon="play"></span><span>설교</span></button>
    <button data-tab="blog"><span class="ti" data-icon="pen"></span><span>블로그</span></button>
    <button data-tab="events"><span class="ti" data-icon="calendar"></span><span>일정</span></button>
  </div>
  <span class="tab-arrow left" aria-hidden="true" data-icon="prev" data-size="12"></span>
  <span class="tab-arrow right" aria-hidden="true" data-icon="next" data-size="12"></span>
</nav>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="js/icons.js"></script>
<script src="js/books.js"></script>
<script src="js/dict.js"></script>
<script src="js/dict2.js"></script>
<script src="js/dict3.js"></script>
<script src="js/app.js"></script>
<script src="js/import.js"></script>
<script src="js/hymn.js"></script>
<script src="js/media.js"></script>
</body>
</html>
