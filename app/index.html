<script>
(function () {
  var el = document.getElementById("splash"), t0 = Date.now(), done = false;
  try { if (sessionStorage.getItem("mw.splashShown")) { el.remove(); return; } sessionStorage.setItem("mw.splashShown", "1"); } catch (e) {}
  function hide() { if (done) return; done = true; el.classList.add("hide"); setTimeout(function () { el.remove(); }, 600); }
  el.addEventListener("click", hide);
  window.addEventListener("load", function () { setTimeout(hide, Math.max(0, 1800 - (Date.now() - t0))); });
  setTimeout(hide, 4000); // 느린 인터넷에서도 오래 붙잡지 않음
})();
</script>
